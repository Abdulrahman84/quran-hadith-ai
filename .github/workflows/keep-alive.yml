name: Keep Render service awake

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-render-service-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ping health endpoint
        env:
          KEEP_ALIVE_URL: ${{ vars.KEEP_ALIVE_URL || 'https://sanaddai.com/api/health' }}
          KEEP_ALIVE_TIMEOUT_SECONDS: 90
        run: npm run keep-alive -- --once
