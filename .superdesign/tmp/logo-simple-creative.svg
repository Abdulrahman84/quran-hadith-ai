<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Two simple creative Sanad AI logo directions</title>
  <desc id="desc">Inline AI uses a one-line open book with AI embedded at the fold. AI Page builds the left page from an A and uses a gold I as the book spine.</desc>
  <rect width="1200" height="700" fill="#F4F0E7"/>

  <g transform="translate(40 40)">
    <rect width="540" height="620" rx="30" fill="#FBFAF5" stroke="#E8E0D2" stroke-width="2"/>
    <text x="42" y="56" fill="#657068" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2">01  INLINE AI</text>

    <g transform="translate(70 105)">
      <path d="M54 86C112 55 167 66 200 99C233 66 288 55 346 86V263C292 238 244 244 200 278C156 244 108 238 54 263V86Z"
            fill="none" stroke="#0B5D3E" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M200 99V278" fill="none" stroke="#0B5D3E" stroke-width="15" stroke-linecap="round"/>
      <rect x="166" y="78" width="68" height="42" rx="12" fill="#FBFAF5"/>
      <text x="200" y="108" text-anchor="middle" fill="#C69A4B" font-family="Arial, sans-serif" font-size="31" font-weight="800" letter-spacing="-2">AI</text>
    </g>

    <g transform="translate(108 420)">
      <text x="0" y="72" fill="#171A19" font-family="'IBM Plex Sans Arabic', Arial, sans-serif" font-size="76" font-weight="700">سند</text>
      <text x="245" y="72" fill="#C69A4B" font-family="Arial, sans-serif" font-size="58" font-weight="700">AI</text>
    </g>

    <g transform="translate(42 550)">
      <path d="M0 16C14 9 28 11 36 19C44 11 58 9 72 16V52C59 46 47 48 36 56C25 48 13 46 0 52V16Z"
            fill="none" stroke="#0B5D3E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M36 19V56" stroke="#0B5D3E" stroke-width="4" stroke-linecap="round"/>
      <text x="36" y="24" text-anchor="middle" fill="#C69A4B" font-family="Arial, sans-serif" font-size="9" font-weight="800" letter-spacing="-1">AI</text>
      <text x="94" y="45" fill="#171A19" font-family="'IBM Plex Sans Arabic', Arial, sans-serif" font-size="34" font-weight="700">سند</text>
      <text x="200" y="45" fill="#C69A4B" font-family="Arial, sans-serif" font-size="25" font-weight="700">AI</text>
      <text x="430" y="42" text-anchor="end" fill="#657068" font-family="Arial, sans-serif" font-size="14">24px test</text>
    </g>
  </g>

  <g transform="translate(620 40)">
    <rect width="540" height="620" rx="30" fill="#FBFAF5" stroke="#E8E0D2" stroke-width="2"/>
    <text x="42" y="56" fill="#657068" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2">02  AI PAGE</text>

    <g transform="translate(70 105)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M50 260L122 96L194 260" stroke="#0B5D3E" stroke-width="18"/>
      <path d="M86 188H158" stroke="#0B5D3E" stroke-width="14"/>
      <path d="M250 116C292 91 325 94 350 115V260C303 239 263 247 224 279"
            stroke="#0B5D3E" stroke-width="18"/>
      <path d="M50 260C113 240 170 248 224 279C263 247 303 239 350 260"
            stroke="#0B5D3E" stroke-width="18"/>
      <path d="M224 125V279" stroke="#C69A4B" stroke-width="18"/>
      <circle cx="224" cy="91" r="14" fill="#C69A4B" stroke="none"/>
    </g>

    <g transform="translate(108 420)">
      <text x="0" y="72" fill="#171A19" font-family="'IBM Plex Sans Arabic', Arial, sans-serif" font-size="76" font-weight="700">سند</text>
      <text x="245" y="72" fill="#C69A4B" font-family="Arial, sans-serif" font-size="58" font-weight="700">AI</text>
    </g>

    <g transform="translate(42 550)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 52L17 14L34 52" stroke="#0B5D3E" stroke-width="4.5"/>
      <path d="M9 35H25" stroke="#0B5D3E" stroke-width="3.5"/>
      <path d="M49 19C59 13 67 14 72 19V52C61 47 52 49 43 57" stroke="#0B5D3E" stroke-width="4.5"/>
      <path d="M0 52C15 47 29 49 43 57C52 49 61 47 72 52" stroke="#0B5D3E" stroke-width="4.5"/>
      <path d="M43 21V57" stroke="#C69A4B" stroke-width="4.5"/>
      <circle cx="43" cy="13" r="4" fill="#C69A4B" stroke="none"/>
      <text x="94" y="45" fill="#171A19" stroke="none" font-family="'IBM Plex Sans Arabic', Arial, sans-serif" font-size="34" font-weight="700">سند</text>
      <text x="200" y="45" fill="#C69A4B" stroke="none" font-family="Arial, sans-serif" font-size="25" font-weight="700">AI</text>
      <text x="430" y="42" text-anchor="end" fill="#657068" stroke="none" font-family="Arial, sans-serif" font-size="14">24px test</text>
    </g>
  </g>
</svg>
