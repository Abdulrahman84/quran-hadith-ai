<header class="fixed inset-x-0 top-0 z-50 border-b border-[#E8E0D2] bg-[#FBFAF5]/95 backdrop-blur">
  <div class="relative mx-auto flex h-20 w-full max-w-[1240px] items-center justify-between gap-3 px-8">
    <a :href="homeHref" class="flex min-w-0 items-center" aria-label="سند — Sanad AI">
      <img
        alt="سند — Sanad AI"
        class="h-12 w-auto object-contain"
        src="/brand/sanad-logo-gold-forward.png?v=gold-forward"
      />
    </a>
    <nav class="flex items-center justify-end gap-8 text-sm font-semibold">
      <a
        :href="howItWorksHref"
        :class="{ 'text-[#0B5D3E]': activeItem === 'how-it-works', 'text-[#657068]': activeItem !== 'how-it-works' }"
        class="relative inline-flex min-h-11 items-center"
      >كيف يعمل</a>
      <a
        :href="sourcePolicyHref"
        :class="{ 'text-[#0B5D3E]': activeItem === 'source-policy', 'text-[#657068]': activeItem !== 'source-policy' }"
        class="relative inline-flex min-h-11 items-center"
      >سياسة المصادر</a>
      <div class="inline-flex items-center gap-0.5 rounded-lg border border-[#E8E0D2] bg-[#E8E0D2] p-1" dir="ltr">
        <button class="min-h-10 rounded-md bg-[#FFFEFA] px-3 text-xs font-bold text-[#0B5D3E]">العربية</button>
        <button class="min-h-10 rounded-md px-3 text-xs font-bold text-[#657068]">English</button>
      </div>
    </nav>
    <span class="pointer-events-none absolute inset-x-8 -bottom-px h-0.5 bg-gradient-to-r from-transparent via-[#C69A4B]/55 to-transparent"></span>
  </div>
</header>
