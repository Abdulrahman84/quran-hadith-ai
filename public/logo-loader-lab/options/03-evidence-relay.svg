<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 120" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Evidence Relay loader</title>
  <desc id="desc">Three source nodes travel toward the center of the open book.</desc>
  <style>
    .relay {
      transform-box: fill-box;
      transform-origin: center;
      opacity: 0;
      animation: relay 2.7s cubic-bezier(.55,.08,.32,1) infinite;
    }
    .relay-two { animation-delay: .32s; }
    .relay-three { animation-delay: .64s; }
    .receiver {
      transform-box: fill-box;
      transform-origin: center;
      animation: receive 2.7s ease-in-out infinite;
    }
    @keyframes relay {
      0% { opacity: 0; transform: translateX(-42px) scale(.7); }
      18% { opacity: 1; }
      62% { opacity: 1; transform: translateX(0) scale(1); }
      76%, 100% { opacity: 0; transform: translateX(0) scale(.45); }
    }
    @keyframes receive {
      0%, 52%, 82%, 100% { transform: scale(1); }
      68% { transform: scale(1.22); }
    }
    .paused * { animation-play-state: paused !important; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .relay { opacity: 1; transform: none; }
    }
  </style>

  <path d="M42 23c23-3 44 4 63 19 19-15 40-22 63-19v69c-24-1-45 5-63 16-18-11-39-17-63-16Z"
        stroke="#0B5D3E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M53 36v46c19 0 36 6 52 17m52-63v46c-19 0-36 6-52 17V44"
        stroke="#0B5D3E" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity=".72"/>

  <path d="M105 44v-9" stroke="#C69A4B" stroke-width="4" stroke-linecap="round"/>
  <circle class="receiver" cx="105" cy="29" r="5.5" fill="#C69A4B"/>
  <rect x="79" y="43" width="52" height="38" rx="17" fill="#C69A4B"/>
  <rect x="86" y="50" width="38" height="22" rx="10" fill="#0B5D3E"/>
  <circle cx="96" cy="61" r="3" fill="#FBFAF5"/>
  <circle cx="114" cy="61" r="3" fill="#FBFAF5"/>

  <path d="M57 102H104" stroke="#C69A4B" stroke-width="2" stroke-linecap="round" opacity=".35"/>
  <circle class="relay relay-one" cx="105" cy="102" r="4" fill="#0B5D3E"/>
  <circle class="relay relay-two" cx="105" cy="102" r="4" fill="#C69A4B"/>
  <circle class="relay relay-three" cx="105" cy="102" r="4" fill="#C63B45"/>
</svg>
