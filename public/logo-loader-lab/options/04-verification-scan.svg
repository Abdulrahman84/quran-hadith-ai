<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 120" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Verification Scan loader</title>
  <desc id="desc">A gold scan line crosses the open book and assistant, then resolves into a green verification mark.</desc>
  <style>
    .scan-line {
      transform-box: fill-box;
      transform-origin: center;
      animation: scan 2.8s cubic-bezier(.55,.08,.32,1) infinite;
    }
    .scan-glow {
      transform-box: fill-box;
      transform-origin: center;
      animation: scan 2.8s cubic-bezier(.55,.08,.32,1) infinite;
    }
    .check {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: verify 2.8s ease-in-out infinite;
    }
    .eye {
      transform-box: fill-box;
      transform-origin: center;
      animation: blink 2.8s ease-in-out infinite;
    }
    .eye-right { animation-delay: .06s; }
    @keyframes scan {
      0%, 12% { opacity: 0; transform: translateY(-48px); }
      20% { opacity: 1; }
      62% { opacity: 1; transform: translateY(47px); }
      70%, 100% { opacity: 0; transform: translateY(47px); }
    }
    @keyframes verify {
      0%, 62% { opacity: 0; stroke-dashoffset: 1; }
      76%, 91% { opacity: 1; stroke-dashoffset: 0; }
      100% { opacity: 0; stroke-dashoffset: 0; }
    }
    @keyframes blink {
      0%, 43%, 49%, 100% { transform: scaleY(1); }
      46% { transform: scaleY(.12); }
    }
    .paused * { animation-play-state: paused !important; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .scan-line,
      .scan-glow { opacity: 0; }
      .check { opacity: 1; stroke-dashoffset: 0; }
    }
  </style>

  <defs>
    <clipPath id="mark-clip">
      <path d="M42 23c23-3 44 4 63 19 19-15 40-22 63-19v69c-24-1-45 5-63 16-18-11-39-17-63-16Z"/>
    </clipPath>
  </defs>

  <path d="M42 23c23-3 44 4 63 19 19-15 40-22 63-19v69c-24-1-45 5-63 16-18-11-39-17-63-16Z"
        stroke="#0B5D3E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M53 36v46c19 0 36 6 52 17m52-63v46c-19 0-36 6-52 17V44"
        stroke="#0B5D3E" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity=".72"/>

  <path d="M105 44v-9" stroke="#C69A4B" stroke-width="4" stroke-linecap="round"/>
  <circle cx="105" cy="29" r="5.5" fill="#C69A4B"/>
  <rect x="79" y="43" width="52" height="38" rx="17" fill="#C69A4B"/>
  <rect x="86" y="50" width="38" height="22" rx="10" fill="#0B5D3E"/>
  <circle class="eye" cx="96" cy="61" r="3" fill="#FBFAF5"/>
  <circle class="eye eye-right" cx="114" cy="61" r="3" fill="#FBFAF5"/>

  <g clip-path="url(#mark-clip)">
    <rect class="scan-glow" x="39" y="50" width="132" height="16" rx="8" fill="#D6B264" opacity=".14"/>
    <path class="scan-line" d="M42 58H168" stroke="#D6B264" stroke-width="3" stroke-linecap="round"/>
  </g>
  <path class="check" pathLength="1" d="m145 98 7 7 14-18" stroke="#18845A" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
