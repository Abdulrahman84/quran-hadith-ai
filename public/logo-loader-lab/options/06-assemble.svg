<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 120" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Reading Loop loader</title>
  <desc id="desc">One page flips across the open book while the assistant blinks and follows it with a subtle glance.</desc>
  <style>
    .turning-page {
      transform-box: view-box;
      transform-origin: 105px 65px;
      animation: page-flip 3.8s cubic-bezier(.55,.08,.32,1) infinite;
    }
    .eyes {
      transform-box: fill-box;
      transform-origin: center;
      animation: eye-story 3.8s ease-in-out infinite;
    }
    @keyframes page-flip {
      0%, 10% {
        opacity: 0;
        transform: scaleX(1) skewY(0);
      }
      14% {
        opacity: 1;
        transform: scaleX(1) skewY(0);
      }
      38% {
        opacity: 1;
        transform: scaleX(.06) skewY(-3deg);
      }
      60% {
        opacity: 1;
        transform: scaleX(-1) skewY(0);
      }
      68% {
        opacity: 0;
        transform: scaleX(-1) skewY(0);
      }
      69%, 100% {
        opacity: 0;
        transform: scaleX(1) skewY(0);
      }
    }
    @keyframes eye-story {
      0%, 15%, 19%, 21%, 40%, 46%, 68%, 74%, 81%, 83%, 100% {
        transform: translateX(0) scaleY(1);
      }
      17% { transform: translateX(0) scaleY(.12); }
      24%, 37% { transform: translateX(2px) scaleY(1); }
      50%, 65% { transform: translateX(-2px) scaleY(1); }
      79% { transform: translateX(0) scaleY(.12); }
    }
    .paused * { animation-play-state: paused !important; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .turning-page { opacity: 0; transform: none; }
      .eyes { transform: none; }
    }
  </style>

  <path d="M42 23c23-3 44 4 63 19 19-15 40-22 63-19v69c-24-1-45 5-63 16-18-11-39-17-63-16Z"
        stroke="#0B5D3E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M53 36v46c19 0 36 6 52 17m52-63v46c-19 0-36 6-52 17V44"
        stroke="#18845A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity=".72"/>

  <g class="turning-page">
    <path d="M105 42c19-15 40-22 63-19v69c-24-1-45 5-63 16Z"
          fill="#FBFAF5" stroke="#D6B264" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M157 36v46c-19 0-36 6-52 17V44" stroke="#C69A4B" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round" opacity=".72"/>
  </g>

  <path d="M105 44v-9" stroke="#C69A4B" stroke-width="4" stroke-linecap="round"/>
  <circle cx="105" cy="29" r="5.5" fill="#C69A4B"/>
  <rect x="79" y="43" width="52" height="38" rx="17" fill="#C69A4B"/>
  <rect x="86" y="50" width="38" height="22" rx="10" fill="#0B5D3E"/>
  <g class="eyes">
    <circle cx="96" cy="61" r="3" fill="#FBFAF5"/>
    <circle cx="114" cy="61" r="3" fill="#FBFAF5"/>
  </g>
</svg>
